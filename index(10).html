<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Skuls</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Skuls">
<meta name="theme-color" content="#1E6B4F">

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F4F1; --card:#FFFFFF; --ink:#17201B; --muted:#5B6660; --line:#E2E5E0;
    --green:#1E6B4F; --green-soft:#E1F0E8; --danger:#B42318;
    --solid:#17201B; --field:#FFFFFF; --chip-ink:#3A433E; --soft:#F3F4F1; --bar:rgba(255,255,255,.96);
    --notice-bg:#FFF7E6; --notice-ink:#5C3D00;
  }
  :root{color-scheme:light}
  html[data-theme="dark"]{color-scheme:dark;
    --bg:#0F1412; --card:#1A211E; --ink:#ECF1EE; --muted:#9AA6A0; --line:#2C3631;
    --green:#2F9468; --green-soft:#1E3A2D; --danger:#FF8577;
    --solid:#34433B; --field:#222B27; --chip-ink:#DCE3DF; --soft:#232C28; --bar:rgba(20,26,23,.96);
    --notice-bg:#2E2614; --notice-ink:#F2D49A}
  html[data-theme="dark"] .tag{color:#7FD3A9}
  html[data-theme="dark"] .btn-link{color:#6FCB9C}
  html[data-theme="dark"] .gnew{border-color:#2F5543;color:#6FCB9C}
  html[data-theme="dark"] .celebrate .bubble{box-shadow:0 12px 40px rgba(0,0,0,.6)}
  html[data-theme="dark"] .tabbar button.on{color:#6FCB9C}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh}
  .wrap{max-width:440px;margin:0 auto;padding:24px 18px 48px;display:flex;flex-direction:column;gap:16px}
  h1{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:0}
  h2{font-size:17px;font-weight:700;margin:0}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .card{color:var(--ink);background:var(--card);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
  .muted{color:var(--muted);font-size:14px}
  .small{font-size:13px}
  .big{font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1.05}
  button{color:inherit;font-family:inherit;font-weight:700;font-size:16px;border:none;border-radius:999px;height:52px;padding:0 20px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .btn-dark{background:var(--solid);color:#fff}
  .btn-green{background:var(--green);color:#fff;border-radius:18px;height:60px;font-size:17px}
  .btn-ghost{background:var(--card);color:var(--ink);border:2px solid var(--line)}
  .btn-link{background:none;color:var(--green);height:44px;padding:0 6px;font-size:15px}
  .btn-danger{background:none;color:var(--danger);height:44px;padding:0 6px;font-size:14px}
  .btn-sm{height:40px;font-size:14px;padding:0 14px}
  button:disabled{opacity:.45;cursor:default}
  .icon-btn{width:44px;height:44px;padding:0;border-radius:22px;background:var(--card);color:var(--ink);flex-shrink:0}
  .avatars{display:flex}
  .av{width:32px;height:32px;border-radius:16px;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;border:2px solid var(--card);flex-shrink:0}
  .avatars .av+.av{margin-left:-9px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{height:40px;border-radius:12px;font-size:14px;padding:0 12px;background:var(--field);color:var(--chip-ink);border:2px solid var(--line)}
  .item{background:var(--card);border-radius:16px;padding:12px 12px 12px 14px;display:flex;flex-direction:column;gap:10px}
  .item input{font-family:inherit;font-size:15px;font-weight:700;border:none;background:transparent;color:var(--ink);padding:4px 0;min-width:0}
  .item input.name{flex:1}
  .item input.price{width:90px;text-align:right;font-weight:600}
  .tag{font-size:11px;font-weight:700;color:var(--green);background:var(--green-soft);border-radius:8px;padding:3px 7px;white-space:nowrap}
  .sum{background:var(--solid);color:#fff;border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
  .sum .line{display:flex;justify-content:space-between;font-size:14px;color:#C9D1CC}
  .sum .line b{color:#fff}
  .sum .res{border-top:1px solid #36423C;padding-top:10px;display:flex;flex-direction:column;gap:6px}
  .sum .res div{display:flex;justify-content:space-between;font-weight:700}
  label.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--muted)}
  input.text{-webkit-text-fill-color:currentColor;font-family:inherit;font-size:16px;height:48px;border-radius:12px;border:2px solid var(--line);padding:0 14px;color:var(--ink);background:var(--field);width:100%}
  input.num{font-family:inherit;font-size:15px;height:40px;width:64px;border-radius:10px;border:2px solid var(--line);text-align:center;color:var(--ink)}
  .entry{color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;background:var(--card);border-radius:16px;padding:14px 16px;border:none;width:100%;height:auto;text-align:left;font-weight:400}
  .entry .r{text-align:right;flex-shrink:0}
  .notice{background:var(--notice-bg);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--notice-ink);line-height:1.45}
  .spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--green);animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .center{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:30px 10px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .mrow{display:flex;align-items:center;gap:10px}
  .mrow input.text{flex:1;height:44px}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
  .tabs button{height:40px;font-size:14px;padding:0 14px;background:var(--card);color:var(--ink);border:2px solid var(--line);white-space:nowrap;flex-shrink:0}
  .tabs button[aria-current="true"]{background:var(--solid);color:#fff;border-color:var(--solid)}
  .tile{height:auto;min-height:96px;border-radius:16px;background:var(--card);color:var(--ink);border:2px solid var(--line);flex-direction:column;gap:4px;padding:12px 8px;font-size:13px;font-weight:700;text-align:center;line-height:1.25}
  .tile svg{color:var(--green)}
  .tile small{font-weight:500;color:var(--muted);font-size:12px}
  .group-entry{border:2px solid transparent;transition:border-color .15s, transform .1s}
  .group-entry:hover{border-color:var(--line)}
  .group-entry:active{transform:scale(.98);border-color:var(--green)}
  .av-sm .av{width:22px;height:22px;font-size:10px;border-width:0}
  html[data-theme="dark"] .badge, html[data-theme="dark"] .irow .cnt{background:#C8372A}
  .badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--danger);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid var(--bg)}
  .qr{background:#fff;border-radius:16px;padding:12px;display:flex;justify-content:center}
  .qr svg{width:220px;height:220px;display:block}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;padding:6px max(8px,calc((100vw - 440px)/2)) calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{position:relative;height:56px;border-radius:14px;background:none;color:var(--muted);flex-direction:column;gap:3px;font-size:12px;font-weight:700;padding:0}
  .tabbar button.on{color:var(--green)}
  .toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,12px);z-index:30;max-width:min(400px,calc(100vw - 32px));width:max-content;background:#17201B;color:#fff;border-radius:14px;padding:12px 16px;font-size:15px;line-height:1.35;display:flex;gap:10px;align-items:center;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast .tk{width:22px;height:22px;border-radius:11px;background:var(--green);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px}
  .toast small{display:block;color:#C9D1CC;font-size:13px}
  .irow{display:grid;gap:6px}
  .irow button{height:auto;background:none;color:var(--ink);flex-direction:column;gap:6px;padding:4px 0;font-size:12px;font-weight:700;line-height:1.2;text-align:center;position:relative}
  .irow .ic{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
  .irow button:active .ic{transform:scale(.92)}
  .irow .cnt{position:absolute;top:0;left:calc(50% + 14px);min-width:20px;height:20px;border-radius:10px;background:var(--danger);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid var(--bg)}
  .seg{display:grid;gap:4px;background:var(--card);border-radius:14px;padding:4px;border:1px solid var(--line)}
  .seg button{height:40px;border-radius:10px;background:none;color:var(--muted);font-size:14px;font-weight:700;padding:0 4px}
  .seg button[aria-selected="true"]{background:var(--solid);color:#fff}
  .sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
  .sheet{width:100%;max-width:480px;background:var(--bg);border-radius:24px 24px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;animation:up .25s cubic-bezier(.2,.9,.3,1)}
  .sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center;margin-bottom:4px}
  .sheet .opt{height:auto;justify-content:flex-start;gap:14px;background:var(--card);color:var(--ink);border-radius:16px;padding:14px 16px;text-align:left;font-weight:400;width:100%}
  .sheet .opt .ic{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .tabbar .scan-fab{height:auto;background:none;padding:0;margin-top:-30px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--green);font-size:12px;font-weight:800}
  .tabbar .scan-fab .ring{width:68px;height:68px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;border:5px solid var(--bg);box-shadow:0 6px 18px rgba(30,107,79,.35),0 0 0 3px var(--green-soft) inset;transition:transform .15s}
  .tabbar .scan-fab .ring svg{width:30px;height:30px;stroke-width:2.4}
  .tabbar .scan-fab:active .ring{transform:scale(.9)}
  .tabbar button.on svg{stroke-width:2.4}
  body.has-nav .wrap{padding-bottom:110px}
  /* celebrations */
  .celebrate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .celebrate .bubble{background:var(--card);color:var(--ink);border-radius:24px;padding:22px 26px;box-shadow:0 12px 40px rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;gap:8px;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both;max-width:300px;text-align:center}
  .celebrate .tick{width:64px;height:64px;border-radius:32px;background:var(--green);display:flex;align-items:center;justify-content:center}
  .celebrate .tick path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .4s .25s ease-out forwards}
  .celebrate .big-msg{font-size:22px;font-weight:800}
  .celebrate .piece{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
  .celebrate.out{animation:fade .35s ease-in forwards}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes fall{to{transform:translate3d(var(--dx),105vh,0) rotate(var(--rot))}}
  @keyframes fade{to{opacity:0}}
  @media (prefers-reduced-motion: reduce){.celebrate .bubble,.celebrate .tick path,.celebrate .piece{animation:none}.celebrate .tick path{stroke-dashoffset:0}.celebrate .piece{display:none}}
  .quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .quick button{height:auto;flex-direction:column;gap:8px;background:var(--card);color:var(--ink);border-radius:18px;padding:14px 6px 12px;font-size:13px;font-weight:700;line-height:1.2;text-align:center}
  .quick .qi{width:52px;height:52px;border-radius:26px;display:flex;align-items:center;justify-content:center;color:#fff}
  .quick button:active .qi{transform:scale(.92)}
  .fact{height:auto;justify-content:flex-start;align-items:center;gap:12px;background:#F3EEFA;color:var(--ink);border:2px solid #E4D9F3;border-radius:18px;padding:14px 16px;font-weight:400;width:100%}
  .fact .fi{width:40px;height:40px;border-radius:20px;background:#7A3FB0;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .swipe{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:2px 18px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .swipe::-webkit-scrollbar{display:none}
  .gcard{flex:0 0 72%;max-width:280px;height:170px;scroll-snap-align:start;scroll-margin-left:18px;border-radius:22px;color:#fff;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:4px;padding:16px 18px;text-align:left;box-shadow:0 6px 18px rgba(23,32,27,.12)}
  .gcard .gname{font-size:20px;font-weight:800;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gcard .gtype{font-size:12px;font-weight:600;opacity:.85}
  .gcard .av{border-color:rgba(255,255,255,.9)}
  .gcard .glabel{font-size:12px;font-weight:700;opacity:.85}
  .gcard .gamount{font-size:24px;font-weight:800;letter-spacing:-.5px}
  .gcard:active{transform:scale(.97)}
  .gnew{flex:0 0 120px;background:var(--card);color:var(--green);border:2px dashed #BFD9CB;box-shadow:none;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:700}
  .catchip{height:26px;border-radius:13px;padding:0 10px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;white-space:nowrap}
  button.catchip{border:none}
</style>

<script>
/*
 * receipt-parser.js – gjør teksten fra en norsk kvittering om til varer. Helt gratis.
 *
 * Telefonens tekstleser (Apple Vision / Google ML Kit) gir bare rå tekst, linje for linje.
 * Her finner vi varer, priser, pant, rabatter, butikk, dato og totalsum.
 * Resultatet har samme form som skanningen med Claude, så appen merker ingen forskjell.
 *
 *   DeltReceipt.parse(text) -> { ok, result: { store, date, total, items:[{name, price, category?}] }, sum, reason }
 *   ok = true betyr at varene summerer seg til totalen på kvitteringen. Da trengs ikke Claude.
 */
(function (root) {
  'use strict';

  const STORES = [
    ['REMA 1000', /\bREMA\s*1000\b/i], ['Kiwi', /\bKIWI\b/i], ['Coop Extra', /\bCOOP\s+EXTRA\b|\bEXTRA\b/i],
    ['Coop Prix', /\bCOOP\s+PRIX\b|\bPRIX\b/i], ['Coop Mega', /\bCOOP\s+MEGA\b/i], ['Coop Obs', /\bOBS\b/i],
    ['Coop Marked', /\bCOOP\s+MARKED\b/i], ['Meny', /\bMENY\b/i], ['Spar', /\bSPAR\b/i], ['Joker', /\bJOKER\b/i],
    ['Bunnpris', /\bBUNNPRIS\b/i], ['Matkroken', /\bMATKROKEN\b/i], ['Oda', /\bODA\b/i], ['Normal', /\bNORMAL\b/i],
    ['Vinmonopolet', /\bVINMONOPOLET\b/i], ['Europris', /\bEUROPRIS\b/i], ['Circle K', /\bCIRCLE\s*K\b/i],
    ['Narvesen', /\bNARVESEN\b/i], ['7-Eleven', /\b7[\s-]*ELEVEN\b/i], ['Coop', /\bCOOP\b/i]
  ];

  // linjer som ikke er varer
  const SKIP = /\b(MVA|MOMS|GRUNNLAG|BANK\s*AXEPT|BANKAXEPT|BANKKORT|VISA|MASTERCARD|KORT|KONTANT|VEKSEL|TILBAKE|BETALT|TERMINAL|AUTORISASJON|REF\.?|KVITTERING|ORG\.?\s*NR|FORETAKSREGISTERET|TLF|TELEFON|ÅPNINGSTID|TAKK FOR|VELKOMMEN|BONUS|TRUMF|MEDLEM|POENG|KASSE|KASSERER|BONG|SALGSKVITTERING|ANT\.?\s*VARER|ANTALL VARER|SALDO|AVRUNDING|ØRES?AVRUNDING|SUBTOTAL)\b/i;
  const TOTAL = /^\s*(SUM|TOTAL|TOTALT|Å BETALE|A BETALE|TOTALSUM|BETALES)\b/i;
  const PRICE_END = /(-?\s?\d{1,3}(?:[ .]\d{3})*[.,]\d{2})\s*-?\s*$/;
  const QTY = /^\s*(\d+(?:[.,]\d+)?)\s*(?:x|X|\*|stk\.?\s*[xà@]?|à|@)\s*(\d+[.,]\d{2})/;
  const WEIGHT = /\d+[.,]\d{1,3}\s*kg\s*[xà@*]\s*\d+[.,]\d{2}/i;

  const num = s => Number(String(s).replace(/\s/g, '').replace(/\.(?=\d{3}\b)/g, '').replace(',', '.'));
  const round = n => Math.round(n * 100) / 100;
  const pretty = s => {
    s = s.replace(/\s{2,}/g, ' ').replace(/^[*#\-.\s]+|[*#\-.\s]+$/g, '').trim();
    if (!s) return s;
    const low = s.toLowerCase();
    return low.charAt(0).toUpperCase() + low.slice(1);
  };

  function findDate(lines) {
    for (const l of lines) {
      let m = /\b(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})\b/.exec(l);
      if (m) {
        let [_, d, mo, y] = m; y = y.length === 2 ? '20' + y : y;
        const iso = `${y}-${mo.padStart(2, '0')}-${d.padStart(2, '0')}`;
        if (!isNaN(Date.parse(iso))) return iso;
      }
      m = /\b(20\d{2})-(\d{2})-(\d{2})\b/.exec(l);
      if (m) return m[0];
    }
    return '';
  }

  function parse(text) {
    const lines = String(text || '').split(/\r?\n/).map(l => l.replace(/\t/g, ' ').trim()).filter(Boolean);
    let store = '';
    for (const l of lines.slice(0, 8)) { const s = STORES.find(([, re]) => re.test(l)); if (s) { store = s[0]; break; } }
    const date = findDate(lines);

    const items = [];
    let total = null;
    let pendingName = null; // varenavn på én linje, pris på neste (vanlig på noen kvitteringer)

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      if (TOTAL.test(line)) {
        const m = PRICE_END.exec(line);
        if (m) { total = num(m[1]); break; }
        const next = lines[i + 1] && PRICE_END.exec(lines[i + 1]);
        if (next && /^\s*-?\s?[\d .,]+\s*$/.test(lines[i + 1])) { total = num(next[1]); break; }
        continue;
      }
      if (SKIP.test(line)) { pendingName = null; continue; }

      const pm = PRICE_END.exec(line);
      if (!pm) {
        // bare tekst: kan være navnet til en vare med pris på neste linje
        if (/[A-Za-zÆØÅæøå]{2,}/.test(line) && !/\d{4,}/.test(line)) pendingName = line;
        continue;
      }
      let price = num(pm[1]);
      if (/-\s*$/.test(line) && price > 0) price = -price; // «10,00-» betyr minus på noen kasser
      let name = line.slice(0, pm.index).trim();

      // «2 x 19,90   39,80» eller «0,512 kg x 49,90  25,55»: linjen hører til varen over
      if ((QTY.test(name) || WEIGHT.test(name)) && !/[A-Za-zÆØÅæøå]{3,}/.test(name.replace(/kg|stk|x/gi, ''))) {
        const unit = QTY.exec(name) ? num(QTY.exec(name)[2]) : null;
        const prev = items[items.length - 1];
        if (pendingName) name = pendingName;                       // «COLA» så «2 x 19,90  39,80»
        else if (prev && prev._qtyable && unit != null && Math.abs(prev.price - unit) < 0.005) {
          prev.price = round(price); prev._qtyable = false; continue; // «COLA 19,90» så «2 x 19,90  39,80»
        } else name = 'Vare (' + name.replace(/\s+/g, ' ') + ')';
      }
      if (!name && pendingName) name = pendingName;
      pendingName = null;
      if (!name || !/[A-Za-zÆØÅæøå]/.test(name)) continue;
      if (Math.abs(price) > 100000) continue;

      const isPant = /\bPANT\b/i.test(name);
      const isDiscount = price < 0 || /\b(RABATT|TILBUD|KAMPANJE|AVSLAG|MENGDERABATT)\b/i.test(name);
      if (isDiscount && items.length && !isPant) {
        // trekk fra på varen over hvis den blir positiv, ellers egen linje
        const prev = items[items.length - 1];
        const p = -Math.abs(price);
        if (prev.price + p >= 0) { prev.price = round(prev.price + p); continue; }
        items.push({ name: pretty(name) || 'Rabatt', price: p });
        continue;
      }
      const it = { name: isPant ? 'Pant' : pretty(name), price: round(price), _qtyable: !isPant };
      if (isPant) it.category = 'pant';
      items.push(it);
    }

    const clean = items.filter(it => it.name && isFinite(it.price) && it.price !== 0).map(({ name, price, category }) => category ? { name, price, category } : { name, price });
    const sum = round(clean.reduce((s, it) => s + it.price, 0));
    const ok = clean.length > 0 && total != null && Math.abs(sum - total) < 0.51; // øresavrunding
    return {
      ok,
      sum,
      reason: !clean.length ? 'no_items' : total == null ? 'no_total' : ok ? 'match' : 'sum_mismatch',
      result: { store, date, total, items: clean }
    };
  }

  const api = { parse };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  root.DeltReceipt = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/*
 * backend.js – kobler appen til Supabase i stedet for Claude.
 *
 * Prøveappen snakker med Claude gjennom window.claude.use('user' | 'db' | 'sample').
 * Denne fila lager en window.claude med nøyaktig de samme funksjonene, men bak
 * dem ligger deres egen Supabase: innlogging, database, sanntid og skanning.
 * Derfor trenger selve appen (index.html) nesten ingen endringer.
 *
 * Trenger (lastes før denne fila):
 *   config.js           -> window.DELT_CONFIG = { supabaseUrl, supabaseAnonKey, appUrl }
 *   vendor/supabase.js  -> window.supabase (kopieres inn av `npm install`)
 *   receipt-parser.js   -> window.DeltReceipt (gratis lesing av kvitteringstekst)
 */
(function () {
  'use strict';
  const cfg = window.DELT_CONFIG || {};
  const INVITE_RE = /#bli-med-([a-z0-9]{6,20})/;
  const PENDING_KEY = 'delt-pending-invite';

  // ---------- Supabase-klient ----------
  if (!window.supabase || !window.supabase.createClient) {
    console.error('Supabase-biblioteket mangler. Kjør `npm install` (kopierer vendor/supabase.js).');
  }
  const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
  });

  let session = null;
  const me = () => (session && session.user && session.user.id) || null;

  // invitasjonskode fra lenke (huskes selv om man må logge inn først)
  function rememberInviteFromHash() {
    const m = INVITE_RE.exec(location.hash || '');
    if (m) { try { localStorage.setItem(PENDING_KEY, m[1]); } catch {} }
  }
  const pendingInvite = () => { try { return localStorage.getItem(PENDING_KEY); } catch { return null; } };
  const clearInvite = () => { try { localStorage.removeItem(PENDING_KEY); } catch {} };
  rememberInviteFromHash();

  // ---------- innlogging med engangskode på e-post ----------
  function el(tag, attrs, html) {
    const e = document.createElement(tag);
    for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
    if (html !== undefined) e.innerHTML = html;
    return e;
  }
  function loginScreen(startStep, presetName) {
    return new Promise(resolve => {
      const start = () => {
        const wrap = el('div', { id: 'delt-login', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Logg inn',
          style: 'position:fixed;inset:0;z-index:100;background:var(--bg,#F3F4F1);color:var(--ink,#17201B);display:flex;align-items:center;justify-content:center;padding:24px;font-family:inherit' });
        wrap.innerHTML = `
          <form id="dl-form" style="width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px">
            <h1 style="margin:0;font-size:30px">${cfg.appName || 'Delt'}</h1>
            <p id="dl-lead" style="margin:0;color:var(--muted,#5B6660);line-height:1.5">Skann kvitteringen, del varene og gjør opp med Vipps. Logg inn med e-posten din for å komme i gang.</p>
            <label id="dl-email-wrap" style="display:flex;flex-direction:column;gap:6px;font-weight:600">E-post
              <input id="dl-email" class="text" type="email" autocomplete="email" inputmode="email" placeholder="navn@eksempel.no" style="height:52px">
            </label>
            <div id="dl-sent" style="display:none;flex-direction:column;gap:10px;background:var(--card,#fff);border-radius:16px;padding:16px;line-height:1.5">
              <b style="font-size:18px">📬 Sjekk e-posten din</b>
              <span>Vi har sendt en kode til <b id="dl-sent-to"></b>. Skriv den inn under.</span>
              <span style="color:var(--muted,#5B6660);font-size:14px">Finner du den ikke? Sjekk søppelpost. Det kan ta et minutt.</span>
            </div>
            <label id="dl-code-wrap" style="display:none;flex-direction:column;gap:6px;font-weight:600">Koden fra e-posten
              <input id="dl-code" class="text" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="123456" style="height:52px;letter-spacing:4px;font-size:22px">
            </label>
            <label id="dl-name-wrap" style="display:none;flex-direction:column;gap:6px;font-weight:600">Hva heter du?
              <input id="dl-name" class="text" autocomplete="given-name" maxlength="40" placeholder="Fornavn" style="height:52px">
            </label>
            <label id="dl-user-wrap" style="display:none;flex-direction:column;gap:6px;font-weight:600">Velg et brukernavn
              <span style="position:relative;display:block">
                <span aria-hidden="true" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted,#5B6660);font-weight:700">@</span>
                <input id="dl-user" class="text" autocapitalize="none" autocorrect="off" autocomplete="username" spellcheck="false" maxlength="20" placeholder="brukernavn" style="height:52px;padding-left:32px;width:100%;box-sizing:border-box">
              </span>
              <span style="font-weight:400;font-size:14px;line-height:1.45;color:var(--muted,#5B6660)">Andre finner deg på brukernavnet når de vil legge deg til i en gruppe. 3–20 tegn: små bokstaver, tall, punktum og understrek.</span>
            </label>
            <div id="dl-err" role="alert" style="display:none;color:var(--danger,#B42318);font-weight:600"></div>
            <button id="dl-btn" class="btn-green" type="submit" style="height:54px">Send kode</button>
            <button id="dl-back" class="btn-link" type="button" style="display:none">Bruk en annen e-post</button>
          </form>`;
        document.body.appendChild(wrap);
        const $ = id => document.getElementById(id);
        let step = 'email', email = '', knownName = presetName || '';
        const suggest = n => (n || '').toLowerCase().replace(/æ/g, 'ae').replace(/ø/g, 'o').replace(/å/g, 'a').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9._]/g, '').slice(0, 20);
        $('dl-user').oninput = e => { const v = e.target.value.toLowerCase().replace(/[^a-z0-9._]/g, ''); if (v !== e.target.value) e.target.value = v; };
        const err = t => { $('dl-err').textContent = t || ''; $('dl-err').style.display = t ? '' : 'none'; };
        const show = s => {
          step = s; err('');
          $('dl-email-wrap').style.display = s === 'email' ? 'flex' : 'none';
          $('dl-code-wrap').style.display = s === 'code' ? 'flex' : 'none';
          $('dl-sent').style.display = s === 'code' ? 'flex' : 'none';
          if (s === 'code') $('dl-sent-to').textContent = email;
          $('dl-name-wrap').style.display = s === 'name' ? 'flex' : 'none';
          $('dl-user-wrap').style.display = s === 'username' ? 'flex' : 'none';
          if (s === 'username' && !$('dl-user').value) { const sg = suggest(knownName); if (sg.length >= 3) $('dl-user').value = sg; }
          $('dl-back').style.display = s === 'code' ? '' : 'none';
          $('dl-btn').textContent = s === 'email' ? 'Send kode' : s === 'code' ? 'Logg inn' : 'Fortsett';
          $('dl-lead').textContent = s === 'email' ? $('dl-lead').textContent
            : s === 'name' ? 'Navnet ditt vises for de andre i gruppene dine.' : '';
          $('dl-lead').style.display = $('dl-lead').textContent ? '' : 'none';
          const f = $(s === 'email' ? 'dl-email' : s === 'code' ? 'dl-code' : s === 'username' ? 'dl-user' : 'dl-name'); if (f) f.focus();
        };
        $('dl-back').onclick = () => show('email');
        $('dl-form').onsubmit = async ev => {
          ev.preventDefault(); err(''); $('dl-btn').disabled = true;
          try {
            if (step === 'email') {
              email = $('dl-email').value.trim().toLowerCase();
              if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { err('Skriv inn en gyldig e-postadresse.'); return; }
              const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true, emailRedirectTo: cfg.appUrl || (location.origin + location.pathname) } });
              if (error) throw error;
              show('code');
            } else if (step === 'code') {
              const token = $('dl-code').value.replace(/\s/g, '');
              if (!/^\d{6,10}$/.test(token)) { err('Koden er tallene du fikk på e-post.'); return; }
              const { data, error } = await sb.auth.verifyOtp({ email, token, type: 'email' });
              if (error) throw error;
              session = data.session;
              const st = await rpc('my_state');
              const mine = st && st.people && st.people[me()];
              if (!mine || !mine.name) { show('name'); return; }
              knownName = mine.name;
              if (needsUsername(mine)) { show('username'); return; }
              wrap.remove(); resolve();
            } else if (step === 'name') {
              const name = $('dl-name').value.trim();
              if (!name) { err('Skriv inn navnet ditt.'); return; }
              await rpc('save_profile', { p_doc: { name } });
              knownName = name;
              const st = await rpc('my_state');
              if (needsUsername(st && st.people && st.people[me()])) { show('username'); return; }
              wrap.remove(); resolve();
            } else if (step === 'username') {
              const u = $('dl-user').value.trim().toLowerCase().replace(/^@/, '');
              if (!/^[a-z0-9._]{3,20}$/.test(u)) { err('Brukernavnet må ha 3–20 tegn: små bokstaver, tall, punktum og understrek.'); return; }
              try { await rpc('set_username', { p_username: u }); }
              catch (e) { if (/Could not find the function|PGRST202/i.test(e.message || '')) { wrap.remove(); resolve(); return; } throw e; }
              wrap.remove(); resolve();
            }
          } catch (e) {
            console.warn(e);
            const c = String((e && (e.code || e.message)) || '');
            err(step === 'code' ? 'Koden stemte ikke, eller den er for gammel. Prøv igjen.'
              : /username_taken/.test(c) ? 'Brukernavnet er tatt. Prøv et annet.'
              : /bad_username/.test(c) ? 'Brukernavnet må ha 3–20 tegn: små bokstaver, tall, punktum og understrek.'
              : 'Noe gikk galt. Sjekk nettet og prøv igjen.');
          } finally { const b = $('dl-btn'); if (b) b.disabled = false; }
        };
        show(startStep || 'email');
      };
      if (document.body) start(); else document.addEventListener('DOMContentLoaded', start);
    });
  }

  // brukernavn spørres bare om når databasen støtter det (feltet finnes, men er tomt)
  const needsUsername = p => !!p && Object.prototype.hasOwnProperty.call(p, 'username') && !p.username;

  async function rpc(name, args) {
    const { data, error } = await sb.rpc(name, args || {});
    if (error) { const e = new Error(error.message || name + ' failed'); e.code = error.message; throw e; }
    return data;
  }

  const ready = (async () => {
    const { data } = await sb.auth.getSession();
    session = data && data.session;
    if (!session) await loginScreen();
    else {
      // logget inn via lenken i e-posten: spør om navn første gang
      try {
        if (/access_token|refresh_token|type=magiclink/.test(location.hash)) history.replaceState(null, '', location.pathname + location.search);
        const st = await rpc('my_state'); const mine = st && st.people && st.people[me()];
        if (!mine || !mine.name) await loginScreen('name');
        else if (needsUsername(mine)) await loginScreen('username', mine.name);
      } catch (e) { console.warn(e); }
    }
    sb.auth.onAuthStateChange((_ev, s) => { session = s; });
    // invitasjonen overlever innloggingen (lenken i e-posten åpner ofte en ny fane)
    const code = pendingInvite();
    if (code && !INVITE_RE.test(location.hash)) history.replaceState(null, '', location.pathname + location.search + '#bli-med-' + code);
  })();

  // ---------- data: samme form som prøveappen ({ v:2, groups:[...], people:{...} }) ----------
  const listeners = new Set();
  let people = {};
  let lastSent = new Map();     // gruppe-id -> JSON slik den sist ble lagret/hentet
  let lastProfile = '';
  const previews = new Map();   // gruppe-id -> invitasjonskode (grupper du er invitert til, men ikke med i)
  let queue = Promise.resolve();
  let fetchTimer = null;

  let adminChecked = false;
  async function fetchState() {
    const st = await rpc('my_state');
    const groups = Array.isArray(st && st.groups) ? st.groups : [];
    people = (st && st.people) || {};
    if (!adminChecked) { adminChecked = true; rpc('is_admin').then(v => { window.DeltBackend.isAdmin = !!v; }).catch(() => {}); }
    window.DeltBackend.state = { requests: Array.isArray(st && st.requests) ? st.requests : [], pending: Array.isArray(st && st.pending) ? st.pending : [] };
    lastSent = new Map(groups.map(g => [g.id, JSON.stringify(g)]));
    lastProfile = JSON.stringify(people[me()] || {});
    previews.clear();
    const code = pendingInvite();
    if (code) {
      if (groups.some(g => g.inviteCode === code)) clearInvite();
      else {
        try {
          const p = await rpc('preview_group', { p_code: code });
          if (p && p.id) { groups.push(p); previews.set(p.id, code); }
        } catch (e) { console.warn('invitasjon', e); }
      }
    }
    const snap = { v: 2, groups, people: JSON.parse(JSON.stringify(people)) };
    listeners.forEach(fn => { try { fn({ data: () => snap }); } catch (e) { console.warn(e); } });
    return snap;
  }
  function refetchSoon(ms) {
    clearTimeout(fetchTimer);
    fetchTimer = setTimeout(() => { queue = queue.then(fetchState).catch(e => console.warn(e)); }, ms == null ? 250 : ms);
  }

  async function writeAll(data) {
    const uid = me(); if (!uid) throw new Error('not_authenticated');
    const seen = new Set();
    for (const g of (data && data.groups) || []) {
      seen.add(g.id);
      if (previews.has(g.id)) {
        const mine = (g.members || []).find(m => m.uid === uid);
        if (mine) {
          const entry = [...(g.entries || [])].reverse().find(e => e.type === 'join' && e.by === uid) || {};
          await rpc('join_group', { p_code: previews.get(g.id), p_member: mine, p_entry: entry });
          previews.delete(g.id); clearInvite();
        }
        continue;
      }
      const json = JSON.stringify(g);
      if (lastSent.get(g.id) !== json) {
        await rpc('save_group', { p_id: g.id, p_doc: g });
        lastSent.set(g.id, json);
      }
    }
    for (const gid of [...lastSent.keys()]) {
      if (!seen.has(gid)) {
        try { await rpc('delete_group', { p_id: gid }); } catch (e) { if (!/not_allowed|only_owner/.test(e.message)) throw e; }
        lastSent.delete(gid);
      }
    }
    const p = data && data.people && data.people[uid];
    if (p) {
      const json = JSON.stringify(p);
      if (json !== lastProfile) { await rpc('save_profile', { p_doc: p }); lastProfile = json; }
    }
    refetchSoon(400);
  }

  let channel = null;
  function subscribe() {
    if (channel || !sb.channel) return;
    channel = sb.channel('delt-' + me())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'groups' }, () => refetchSoon())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'group_members' }, () => refetchSoon())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => refetchSoon())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'group_requests' }, () => refetchSoon())
      .subscribe();
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refetchSoon(0); });
  }

  const dbApi = {
    doc() {
      return {
        onSnapshot(cb, errCb) {
          listeners.add(cb);
          queue = queue.then(fetchState).then(subscribe).catch(e => { console.warn(e); if (errCb) errCb(e); });
          return () => listeners.delete(cb);
        },
        set(data) {
          const run = queue.then(() => writeAll(JSON.parse(JSON.stringify(data))));
          queue = run.catch(() => {});
          return run;
        }
      };
    }
  };

  // ---------- bruker ----------
  const userApi = {
    async id() { return me(); },
    async profiles(ids) {
      const out = {};
      for (const id of ids || []) if (people[id]) out[id] = { name: people[id].name || '' };
      const missing = (ids || []).filter(id => !out[id]);
      if (missing.length) {
        const { data } = await sb.from('profiles').select('user_id,name').in('user_id', missing);
        for (const r of data || []) out[r.user_id] = { name: r.name || '' };
      }
      return out;
    },
    async search(q) {
      const rows = await rpc('search_profiles', { p_q: q || '' });
      return (rows || []).map(r => ({ id: r.id, name: r.name, username: r.username || '' }));
    }
  };

  // ---------- skanning: gratis på telefonen først, Claude Haiku som reserve ----------
  const toBase64 = blob => new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1] || '');
    r.onerror = rej; r.readAsDataURL(blob);
  });
  async function callScanFunction(body, signal) {
    const { data, error } = await sb.functions.invoke(cfg.scanFunction || 'scan-receipt', { body });
    if (signal && signal.aborted) { const e = new Error('aborted'); e.name = 'AbortError'; throw e; }
    if (error) {
      let code = 'scan_failed';
      try { const j = await error.context.json(); code = j.error || code; } catch {}
      const e = new Error(code); e.code = code === 'rate_limited' ? 'rate_limited' : code; throw e;
    }
    return data;
  }
  const sampleApi = {
    async json(prompt, opts) {
      const img = opts && opts.images && opts.images[0];
      const signal = opts && opts.signal;
      // 1) tekstleseren på telefonen (gratis), hvis den er koblet til
      if (img && typeof window.DeltBackend.ocr === 'function') {
        let text = null;
        try { text = await window.DeltBackend.ocr(img); } catch (e) { console.warn('ocr', e); }
        if (text && text.trim()) {
          const parsed = window.DeltReceipt ? window.DeltReceipt.parse(text) : null;
          if (parsed && parsed.ok) return parsed.result;          // stemte med totalen: ferdig, 0 kr
          return await callScanFunction({ mode: 'text', text, prompt }, signal); // bare teksten sendes videre
        }
      }
      // 2) ingen tekstleser: send bildet til serveren
      if (!img) throw new Error('no_image');
      const image = await toBase64(img);
      return await callScanFunction({ mode: 'image', image, mediaType: img.type || 'image/jpeg', prompt }, signal);
    }
  };

  // ---------- ekstra som appen kan bruke ----------
  const enqueue = fn => { const run = queue.then(fn); queue = run.catch(() => {}); return run; };
  window.DeltBackend = {
    client: sb,
    state: { requests: [], pending: [] },
    async setUsername(u) { const r = await rpc('set_username', { p_username: u }); refetchSoon(0); return r; },
    usernameAvailable(u) { return rpc('username_available', { p_username: u }); },
    sendRequest(gid, toUid, memberId) { return enqueue(() => rpc('send_group_request', { p_group: gid, p_to: toUid, p_member_id: memberId || null })).finally(() => refetchSoon(300)); },
    answerRequest(id, accept) { return enqueue(() => rpc('answer_group_request', { p_id: id, p_accept: !!accept })).finally(() => refetchSoon(0)); },
    cancelRequest(id) { return enqueue(() => rpc('cancel_group_request', { p_id: id })).finally(() => refetchSoon(0)); },
    removeMember(gid, uid) { return enqueue(() => rpc('remove_member', { p_group: gid, p_uid: uid })); },
    isAdmin: false,
    adminOverview() { return rpc('admin_overview'); },
    ocr: null, // settes av app-oppsettet hvis telefonens tekstleser er installert (se README)
    async signOut() {
      try { await sb.auth.signOut(); } catch {}
      try { localStorage.removeItem('delt-data'); localStorage.removeItem('delt-roll'); localStorage.removeItem('delt-rels'); } catch {}
      location.hash = ''; location.reload();
    },
    async deleteAccount() {
      try { await queue; } catch {}
      await rpc('delete_me');
      await this.signOut();
    },
    openUrl(url) {
      const cap = window.Capacitor && window.Capacitor.Plugins;
      if (cap && cap.AppLauncher) return cap.AppLauncher.openUrl({ url });
      window.location.href = url;
    },
    // kalles når appen åpnes fra en invitasjonslenke
    async openInvite(code) {
      try { localStorage.setItem(PENDING_KEY, code); } catch {}
      await ready;
      queue = queue.then(fetchState).catch(e => console.warn(e));
      await queue;
      location.hash = '#bli-med-' + code; // nå finnes gruppen i dataene, så appen viser «Bli med»
    }
  };

  // åpnet fra lenke mens appen er installert (Capacitor)
  try {
    const capApp = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
    if (capApp) capApp.addListener('appUrlOpen', ev => {
      const m = INVITE_RE.exec(ev && ev.url || '');
      if (m) window.DeltBackend.openInvite(m[1]);
    });
  } catch (e) { console.warn(e); }

  // samme grensesnitt som Claude ga prøveappen
  window.claude = {
    ready,
    async use(name) {
      await ready;
      if (name === 'user') return userApi;
      if (name === 'db') return dbApi;
      if (name === 'sample') return sampleApi;
      return null;
    }
  };
})();

</script>

		return this.num[index];

		return this.num.length;

			return this;

	}

      for (const e of g.entries) if (e.by === meUid) e.by = '';
      // stop fixed costs that I was paying, so new months are not booked to a deleted person

        if (rec.length >= 2) { const big = rec.slice().sort((a, b) => total(b) - total(a))[0]; facts.push(`Største kvittering i ${month}: ${big.store || 'en handletur'} på ${krShort(total(big))}.`); }

        }
        // pant

        if (pant > 0) facts.push(`Dere har betalt ${krShort(pant)} i pant i ${g.name} i ${month}. Husk å pante flaskene!`);

      return `<div class="card" style="gap:0">
        <h2 style="margin-bottom:6px">${side === 'inn' ? 'Disse skylder deg' : 'Du skylder'}</h2>

      </div>`;
    };
    const head = !meUid ? '' : `
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
        ${box('inn', 'Du skal ha', sumInn, inn, 'var(--green)', '#CFE6DA')}
        ${box('ut', 'Du skylder', sumUt, ut, 'var(--danger)', '#F2D3CF')}
      </div>
      ${open ? listFor(open) : ''}`;
    const list = groups.map(g => {
      const v = myGroupNet(g);
      let amt = '';
      if (v !== null) {
        const rv = r2(v);
        amt = Math.abs(rv) < 0.005
          ? `<div class="small" style="font-weight:700;color:var(--muted)">Skuls</div><div style="font-weight:800;font-size:17px">0 kr</div>`
          : rv > 0
            ? `<div class="small" style="font-weight:700;color:var(--green)">Du skal ha</div><div style="font-weight:800;font-size:17px;color:var(--green)">${krShort(rv)}</div>`

      ${storageNote()}`;
    const recent = meUid ? notifications().slice(0, 3) : [];
    return `
      <div class="row"><div style="display:flex;flex-direction:column;gap:2px;min-width:0"><h1>${myName ? greeting() + ', ' + esc(myName.split(' ')[0]) : 'Min konto'}</h1>${meUid ? `<div class="muted" style="font-weight:600">${statusLine(groups)}</div>` : ''}</div>
        ${meUid ? `<button class="icon-btn" data-tab="profile" aria-label="Rediger profilen din" style="width:48px;height:48px;border-radius:24px;padding:0;overflow:hidden;border:2px solid var(--line)">${myAvatar(44)}</button>` : '<span></span>'}</div>

      ${meUid && groups.length ? todayCard() : ''}

      <div class="swipe" role="list">${groups.map(g => swipeCard(g)).join('')}<button class="gcard gnew" data-act="newGroup" role="listitem"><span style="font-size:30px;line-height:1">+</span><span>Ny gruppe</span></button></div>` : ''}
      ${groups.length ? '' : `<div class="card" style="gap:10px"><b>Kom i gang</b><div class="muted">Lag en gruppe med kjæresten, samboerne eller vennegjengen, og skann første kvittering.</div><button class="btn-green" data-act="newGroup">+ Lag din første gruppe</button></div>`}
      ${recent.length ? `

            <div style="min-width:0;display:flex;flex-direction:column;gap:3px">
              <span style="font-weight:${n.unread ? 800 : 600}">${esc(n.title)}</span>

  function vPeople() {

  // ---------- member search (accounts) ----------
  const MAX_MEMBERS = 10;
  let lastQuery = '', keepSearchOpen = false;
  const draftPending = () => gdraft ? (reqState().pending || []).filter(q => q.groupId === gdraft.id) : [];
  const draftCount = () => gdraft.members.length + (gdraft.invites || []).filter(i => !i.memberId).length + draftPending().filter(q => !q.memberId).length;
  function searchBox() {
    const full = draftCount() >= MAX_MEMBERS && linkIdx === null;
    if (full) return `<div class="notice">Gruppen er full. En gruppe kan ha maks ${MAX_MEMBERS} personer.</div>`;
    if (!user) return `<button class="btn-ghost btn-sm" data-act="addMember">+ Legg til person</button>`;
    return `
      <label class="field">${linkIdx !== null ? `Koble «${esc(gdraft.members[linkIdx]?.name || '')}» til en konto` : `Legg til person med konto (${draftCount()} av ${MAX_MEMBERS})`}
        <input class="text" id="psearch" placeholder="${hasRequests() ? 'Søk på brukernavn, f.eks. @ida' : 'Søk etter navn'}" autocomplete="off" autocapitalize="none" spellcheck="false" value="${esc(lastQuery)}">
      </label>
      <div id="presults" style="display:flex;flex-direction:column;gap:6px"></div>

  }
  async function runSearch(q) {
    const box = document.getElementById('presults'); if (!box || !user) return;
    try {
      const hits = await user.search(q || '');
      const taken = new Set([...gdraft.members.map(m => m.uid), ...(gdraft.invites || []).map(i => i.uid), ...draftPending().map(q => q.toUid), meUid].filter(Boolean));
      const list = (hits || []).filter(h => h && h.id && !taken.has(h.id)).slice(0, 8);
      box.innerHTML = list.length ? '' : (q ? `<div class="muted small">Fant ingen${hasRequests() ? ' med det brukernavnet' : ''}. ${hasRequests() ? 'Sjekk stavingen, eller send en invitasjonslenke i stedet.' : 'Du finner folk du allerede deler en gruppe med, eller ved å søke på hele telefonnummeret. Det enkleste er å sende en invitasjonslenke.'}</div>` : '');
      for (const h of list) {
        const b = document.createElement('button');
        b.className = 'btn-ghost btn-sm'; b.style.justifyContent = 'flex-start'; b.style.gap = '6px';
        const nmEl = document.createElement('b'); nmEl.textContent = h.name || 'Uten navn'; b.appendChild(nmEl);
        if (h.username) { const u = document.createElement('span'); u.className = 'muted'; u.style.fontWeight = '500'; u.textContent = '@' + h.username; b.appendChild(u); }
        b.onclick = () => addAccount(h.id, h.name || '', h.username || '');
        box.appendChild(b);
      }

  }
  function addAccount(id, name, username) {
    readGroupInputs();
    if (name) profiles[id] = name;
    if (hasRequests() && meUid) {
      // kontoer legges ikke rett inn: de får en forespørsel når gruppen lagres
      const memberId = linkIdx !== null && gdraft.members[linkIdx] ? gdraft.members[linkIdx].id : null;
      if (!memberId && draftCount() >= MAX_MEMBERS) return;
      gdraft.invites = (gdraft.invites || []).filter(i => i.uid !== id && (!memberId || i.memberId !== memberId));
      gdraft.invites.push({ uid: id, name: name || 'Uten navn', username: username || '', memberId });
      linkIdx = null; lastQuery = ''; keepSearchOpen = false;
      keepScroll(render); return;
    }
    if (linkIdx !== null && gdraft.members[linkIdx]) { gdraft.members[linkIdx].uid = id; if (name) gdraft.members[linkIdx].name = name; linkIdx = null; }

    const inviteRows = (g.invites || []).map((v, i) => `
      <div class="mrow">

        <div style="flex:1;min-width:0;display:flex;flex-direction:column"><span style="font-weight:700">${esc(v.name)}${v.username ? ` <span class="muted" style="font-weight:500">@${esc(v.username)}</span>` : ''}</span>
          <span class="muted small">${v.memberId ? `Kobles til «${esc((g.members.find(m => m.id === v.memberId) || {}).name || '')}». ` : ''}Får en forespørsel når du trykker «${existing ? 'Lagre' : 'Lag gruppen'}»</span></div>
        <button class="icon-btn" data-invdel="${i}" aria-label="Ikke send forespørsel til ${esc(v.name)}" style="border:2px solid var(--line)">${icX}</button>
      </div>`).join('');

      <div class="mrow">
        <div class="av" style="background:#5B6660;width:36px;height:36px;border-radius:18px;border:none" aria-hidden="true">${esc(initial(q.toName || '?'))}</div>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column"><span style="font-weight:700">${esc(q.toName || 'Uten navn')}${q.toUsername ? ` <span class="muted" style="font-weight:500">@${esc(q.toUsername)}</span>` : ''}</span>
          <span class="muted small">Venter på svar</span></div>
        <button class="btn-link" data-reqcancel="${esc(String(q.id))}" style="height:36px;font-size:14px">Avbryt</button>
      </div>`).join('');
    return `
      <div class="row">
        <button class="icon-btn" data-act="cancelGroup" aria-label="Tilbake">${icBack}</button>
        <h2>${existing ? 'Endre gruppe' : 'Ny gruppe'}</h2><span style="width:44px"></span>
      </div>
      <div class="card">
        <label class="field">Navn på gruppen<input class="text" id="gname" value="${esc(g.name)}" maxlength="30" placeholder="F.eks. Hjemme, Hyttetur, Vennegjengen"></label>
      </div>
      <div class="card">
        <h2>Hva slags gruppe er dette?</h2>
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
          ${[['home', 'Vi bor sammen', 'Kjæreste, samboer, kollektiv. Med faste utgifter og matbudsjett.'], ['friends', 'Vi er venner', 'Turer, middager og fest. Bare utgifter og kvitteringer.']].map(([k, t, d]) => {
            const on = g.type === k;
            return `<button type="button" data-gtype="${k}" aria-pressed="${on}" style="height:auto;flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:left;gap:4px;padding:12px;border-radius:14px;background:${on ? 'var(--green-soft)' : 'var(--card)'};border:2px solid ${on ? 'var(--green)' : 'var(--line)'};color:var(--ink)">
              <span style="font-weight:700;font-size:15px">${t}</span><span style="font-weight:500;font-size:12px;color:var(--muted);line-height:1.35">${d}</span></button>`;
          }).join('')}
        </div>
      </div>
      <div class="card">
        <div class="row"><h2>Personer</h2><span class="muted small">${g.members.length} stk</span></div>
        ${rows}
        ${inviteRows}
        ${pendingRows}
        ${searchBox()}
        <p class="muted small" style="margin:0">${hasRequests() ? `Folk med konto får en forespørsel og kommer inn når de godtar. ${owner ? 'Som eier kan du fjerne folk. Har noen vært med på kvitteringer, blir navnet stående i historikken.' : 'Bare eieren av gruppen kan fjerne folk med konto.'}` : 'Alle i gruppen ser gruppen på sin egen konto. Personer som er brukt i kvitteringer kan ikke fjernes.'}</p>
      </div>
      <div class="card">
        <div class="row"><h2>Fordeling av felles varer</h2></div>
        <div class="chips">
          <button class="chip" data-act="splitEqual" aria-pressed="${!g.custom}" style="${!g.custom ? 'background:var(--solid);color:#fff;border-color:var(--solid)' : ''}">Likt</button>
          <button class="chip" data-act="splitCustom" aria-pressed="${!!g.custom}" style="${g.custom ? 'background:var(--solid);color:#fff;border-color:var(--solid)' : ''}">Egen fordeling</button>
        </div>
        ${g.custom ? `<p class="muted small" style="margin:0">Skriv inn andelen for hver person ved siden av navnet, for eksempel 60 og 40.</p>` : ''}
      </div>
      <div id="gerr" class="notice" style="display:none" role="alert"></div>
      <button class="btn-dark" data-act="saveGroup">${existing ? 'Lagre' : 'Lag gruppen'}</button>
      ${existing && owner ? `<div class="card" style="gap:8px;margin-top:10px">
        <div style="font-weight:700">Slett gruppen</div>
        <div class="muted small">Gruppen, kvitteringene, gjøremålene og alt annet i den slettes for alle. Det kan ikke angres.</div>
        <div id="delWarn" class="notice" style="display:none" role="alert"></div>
        <button class="btn-danger" data-act="deleteGroup" style="align-self:flex-start;padding:0">Slett gruppen</button>
      </div>` : ''}`;
  }

  let lastHomeG = null;
  function vHome() {
    const g = G(); if (!g) return vGroups();
    if (g.id !== lastHomeG) { gTab = 'over'; lastHomeG = g.id; }
    const net = balances(g);
    const t = transfers(net);
    const me = myId(g);
    let head;
    if (me) {
      const v = net[me] || 0;
      const mine = t.filter(x => x.from === me || x.to === me);
      const allEven = !t.length && g.entries.some(e => e.type === 'receipt' || e.type === 'settle');
      head = `<div class="muted" style="font-weight:600">${allEven ? 'Dere er skuls 🎉' : Math.abs(r2(v)) < 0.005 ? 'Du er skuls i gruppen' : (v > 0 ? 'Du skal ha' : 'Du skylder')}</div>
        <div class="big" style="color:${r2(v) > 0.004 ? 'var(--green)' : (r2(v) < -0.004 ? 'var(--danger)' : 'var(--ink)')}">${roll('g-' + g.id, Math.abs(v), r2(v) > 0.004 ? 'rgba(30,107,79,.55)' : r2(v) < -0.004 ? 'rgba(180,35,24,.5)' : '')}</div>
        ${mine.map(x => { const other = x.to === me ? x.from : x.to; return `<div class="row"><span class="row" style="gap:6px;justify-content:flex-start">${av(g, other)}${relLine(mName(g, other), x.amount, x.to === me, 'gr-' + g.id + '-' + other + (x.to === me ? '-in' : '-out')).replace(/<\/span><b/, '</span></span><b')}</div>`; }).join('')}`;
    } else if (!t.length) head = `<div class="muted" style="font-weight:600">Alle er skuls 🎉</div><div class="big">0 kr</div>`;
    else head = `<div class="muted" style="font-weight:600">For å bli skuls</div>${t.slice(0, 6).map(x => `<div class="row"><span class="row" style="gap:6px;justify-content:flex-start">${av(g, x.from)}<span>${esc(mName(g, x.from))} skylder ${esc(mName(g, x.to))}</span></span><b>${krShort(x.amount)}</b></div>`).join('')}`;
    const listArr = [...g.entries].filter(e => e.type === 'receipt' || e.type === 'settle').reverse().slice(0, 40).map(e => {
      if (e.type === 'settle') return `<button class="entry" data-entry="${e.id}"><div><div style="font-weight:700">Oppgjør</div><div class="muted small">${fmtDate(e.date)} · ${esc(mName(g, e.from))} → ${esc(mName(g, e.to))}</div></div><div class="r" style="font-weight:700">${kr(e.amount)}</div></button>`;
      const total = e.items.reduce((s, it) => s + (Number(it.price) || 0), 0);
      const kindTag = e.kind === 'recurring' ? ' · Fast utgift' : e.kind === 'expense' ? ' · Uten kvittering' : '';
      return `<button class="entry" data-entry="${e.id}"><div><div style="font-weight:700">${esc(e.store || 'Kvittering')}</div><div class="muted small">${fmtDate(e.date)} · ${esc(mName(g, e.payer))} betalte${kindTag}</div></div><div class="r" style="font-weight:700">${kr(total)}</div></button>`;
    });
    const list = listArr.join('');
    const nEntries = g.entries.filter(e => e.type === 'receipt' || e.type === 'settle').length;
    const home = livesTogether(g);
    const tab = home ? gTab : (gTab === 'home' ? 'over' : gTab);
    const tabs = home ? [['over', 'Oversikt'], ['home', 'Hjemme'], ['hist', 'Historikk']] : [['over', 'Oversikt'], ['hist', 'Historikk']];
    const tabsHtml = `<div class="seg" role="tablist" style="grid-template-columns:repeat(${tabs.length},minmax(0,1fr))">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${tab === k}" data-gtab="${k}">${l}</button>`).join('')}</div>`;
    const openList = (g.list || []).filter(l => !l.done).length;
    const ic = (attr, color, icon, label, cnt) => `<button ${attr}><span class="ic" style="background:${color}">${icon}</span>${cnt ? `<span class="cnt">${cnt > 9 ? '9+' : cnt}</span>` : ''}<span>${label}</span></button>`;
    const icons = [
      ic('data-act="expense"', '#2457C5', icPlus, 'Utgift'),
      home ? ic('data-go="recurring"', '#7A3FB0', icRepeat, 'Faste') : '',
      ic('data-go="list"', '#B4511A', icList, 'Handleliste', openList),
      home ? ic('data-go="chores"', 'var(--green)', icBroom, 'Gjøremål') : ''
    ].filter(Boolean);
    const split = (livesTogether(g) ? 'Bor sammen · ' : 'Venner · ') + (g.custom ? 'Felles varer: egen fordeling' : 'Felles varer deles likt');
    return `
      <div class="row">
        <button class="icon-btn" data-go="groups" aria-label="Alle grupper">${icBack}</button>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px">
          <h1 style="font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(g.name)}</h1>
          <div class="avatars">${g.members.slice(0, 6).map(m => av(g, m.id)).join('')}${g.members.length > 6 ? `<div class="av" style="background:#5B6660">+${g.members.length - 6}</div>` : ''}</div>
        </div>
        <button class="icon-btn" data-go="invite" aria-label="Inviter folk til gruppen">${icInvite}</button>
        <button class="icon-btn" data-act="editGroup" aria-label="Endre gruppe">${icGear}</button>
      </div>
      ${meUid && !me ? `<div class="notice">Personene i denne gruppen er ikke koblet til kontoer ennå. Trykk på tannhjulet og «Koble» for hver person.</div>` : ''}
      ${tabsHtml}
      ${tab === 'over' ? `
      <div class="card">
        ${head}
        <div class="muted small">${g.members.length} personer · ${split}</div>
        ${t.length ? `<button class="btn-dark" data-go="settle" style="margin-top:6px">Gjør opp med Vipps</button>` : ''}
      </div>
      <div class="irow" style="grid-template-columns:repeat(${icons.length},minmax(0,1fr))">${icons.join('')}</div>
      ${list ? `<div class="row" style="margin-top:4px"><h2>Siste kvitteringer</h2>${nEntries > 3 ? `<button class="btn-link" data-gtab="hist" style="height:32px;font-size:14px">Se alle</button>` : ''}</div>${listArr.slice(0, 3).join('')}` : `<div class="muted" style="text-align:center;padding:12px 0">Ingen kvitteringer ennå. Trykk på den grønne knappen nederst for å skanne den første.</div>`}` : ''}
      ${tab === 'home' ? `
      ${budgetCard(g)}
      ${choresCard(g)}
      ${recurringCard(g)}
      ${listCard(g)}` : ''}
      ${tab === 'hist' ? `
      <div class="row"><h2>Historikk</h2><span class="muted small">${nEntries} oppføringer</span></div>
      ${list || `<div class="muted" style="text-align:center;padding:20px 0">Ingen kvitteringer ennå.</div>`}` : ''}`;
  }

  function vScanning() {
    return `
      <div class="center" style="padding-top:80px">
        <div class="spinner" aria-hidden="true"></div>
        <h2>Leser kvitteringen …</h2>
        <div class="muted">Dette tar vanligvis noen sekunder.</div>
        <button class="btn-link" data-act="cancelScan">Avbryt</button>
      </div>`;
  }

  function vAssign() {
    const g = G(), d = draft;
    const total = d.items.reduce((s, it) => s + (Number(it.price) || 0), 0);
    const sh = shares(g, d.items, g.weights);
    const on = (c) => `background:${c};border-color:${c};color:#fff`;
    const items = d.items.map((it, i) => {
      const all = !it.share && isAll(g, it.who);
      const shareOn = !!it.share;
      const n = it.who.length;
      const chips = `<button class="chip" data-all="${i}" aria-pressed="${all}" style="${all ? on('var(--green)') : ''}">Felles</button>` +
        `<button class="chip" data-share="${i}" aria-pressed="${shareOn}" style="${shareOn ? on('#5A3E8C') : ''}">${shareOn && n ? `Deling (${n})` : 'Deling'}</button>` +
        g.members.map(m => { const sel = !all && it.who.includes(m.id); return `<button class="chip" data-who="${m.id}" data-i="${i}" aria-pressed="${sel}" style="${sel ? on(m.color) : ''}">${esc(m.name)}</button>`; }).join('');
      const hint = shareOn
        ? (n < 2 ? `<div class="small" style="color:#5A3E8C;font-weight:600">Trykk på dem som deler varen.</div>`
                 : `<div class="small" style="color:#5A3E8C;font-weight:600">Deles likt: ${esc(it.who.map(id => mName(g, id)).join(' og '))} betaler ${kr((Number(it.price) || 0) / n)} hver</div>`)
        : '';
      return `
      <div class="item">
        <div class="row">
          <input class="name" data-name="${i}" value="${esc(it.name)}" aria-label="Varenavn">
          ${it.pantAuto && d.items[it.pantOf] ? `<span class="tag">Følger ${esc(d.items[it.pantOf].name)}</span>` : it.learned ? '<span class="tag">Husket</span>' : it.fromList ? '<span class="tag">Fra handlelisten</span>' : ''}
          <input class="price" data-price="${i}" inputmode="decimal" value="${esc(String(it.price).replace('.', ','))}" aria-label="Pris">
        </div>
        <div class="row" style="justify-content:flex-start;gap:6px;margin-top:-4px">
          <button type="button" class="catchip" data-cat="${i}" aria-label="Kategori: ${catOf(it.cat).label}. Trykk for å bytte" style="background:${catOf(it.cat).bg};color:${catOf(it.cat).color}">${catOf(it.cat).label} ▾</button>
          ${FOOD_CATS.includes(it.cat) ? '' : '<span class="muted small">telles ikke i matbudsjettet</span>'}
        </div>
        <div class="chips">${chips}</div>
        ${hint}
      </div>`;
    }).join('');
    const payChips = g.members.map(m => { const sel = d.payer === m.id; return `<button class="chip" data-payer="${m.id}" aria-pressed="${sel}" style="${sel ? on('var(--solid)') : ''}">${esc(m.name)}</button>`; }).join('');
    const owes = g.members.filter(m => m.id !== d.payer && sh[m.id] > 0.004)
      .map(m => `<div><span>${esc(m.name)} skylder ${esc(mName(g, d.payer))}</span><span>${kr(sh[m.id])}</span></div>`).join('');
    const mismatch = d.receiptTotal && Math.abs(d.receiptTotal - total) > 0.05;
    return `
      <div class="row">
        <button class="icon-btn" data-act="cancelDraft" aria-label="Avbryt">${icBack}</button>
        <div style="text-align:center;flex:1;min-width:0">
          <input class="text" id="store" value="${esc(d.store)}" aria-label="Butikk" placeholder="Butikk" style="height:40px;text-align:center;font-weight:700;border-color:transparent;background:transparent">
          <div class="muted small">${fmtDate(d.date)} · ${kr(total)} · ${esc(g.name)}</div>
        </div>
        <span style="width:44px"></span>
      </div>
      ${mismatch ? `<div class="notice">Summen av varene (${kr(total)}) stemmer ikke med totalen på kvitteringen (${kr(d.receiptTotal)}). Sjekk prisene.</div>` : ''}
      <div><div class="muted" style="font-weight:600;margin-bottom:8px">Hvem betalte?</div><div class="chips">${payChips}</div></div>
      <div class="row"><h2>Varer</h2><button class="btn-link" data-act="allShared">Alt felles</button></div>
      <p class="muted small" style="margin:-8px 0 0;line-height:1.45">Trykk på et navn hvis varen er til én person. «Felles» er hele gruppen. «Deling» lar dere velge hvem som deler varen.</p>
      ${items}
      <button class="btn-ghost" data-act="addItem">+ Legg til vare</button>
      <div class="sum">
        ${g.members.map(m => `<div class="line"><span>${esc(m.name)}</span><b>${kr(sh[m.id])}</b></div>`).join('')}
        <div class="res">${owes || '<div><span>Ingen skylder noe</span><span></span></div>'}</div>
      </div>
      <button class="btn-green" data-act="saveDraft" ${d.items.length ? '' : 'disabled'}>Lagre i saldoen</button>`;
  }

  function vSettle() {
    const g = G(); const t = transfers(balances(g));
    const rows = t.map((x, i) => `
      <div class="card">
        <div class="row">
          <span class="row" style="gap:8px;justify-content:flex-start">${av(g, x.from)}<span style="font-weight:700">${x.from === myId(g) ? `Du skylder ${esc(mName(g, x.to))}` : x.to === myId(g) ? `${esc(mName(g, x.from))} skylder deg` : `${esc(mName(g, x.from))} skylder ${esc(mName(g, x.to))}`}</span></span>
          <span style="font-weight:800;font-size:18px;color:${x.from === myId(g) ? 'var(--danger)' : x.to === myId(g) ? 'var(--green)' : 'var(--ink)'}">${krShort(x.amount)}</span>
        </div>
        ${(() => { const to = mem(g, x.to); const n = to && vippsNumber(to.uid); return n ? `<div class="muted small">Vipps til ${esc(mName(g, x.to))}: <b style="color:var(--ink)">${esc(person(to.uid).phone)}</b></div>` : ''; })()}
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
          <button class="btn-ghost btn-sm" data-copy="${x.amount}">Kopier beløp</button>
          ${x.from === myId(g)
            ? `<button class="btn-dark btn-sm" data-vipps="${i}" style="background:#FF5B24">Betal med Vipps</button>`
            : `<button class="btn-dark btn-sm" data-paid="${i}">Er betalt</button>`}
        </div>
      </div>`).join('');
    const undoE = view.undo && g.entries.find(e => e.id === view.undo);
    const undo = undoE ? `<div class="notice" style="display:flex;align-items:center;justify-content:space-between;gap:10px">
        <span><b>Gjort opp i appen:</b> ${krShort(undoE.amount)} til ${esc(mName(g, undoE.to))}. Fullfør betalingen i Vipps.</span>
        <button class="btn-ghost btn-sm" data-undo="${undoE.id}" style="flex-shrink:0">Angre</button></div>` : '';
    return `
      <div class="row"><button class="icon-btn" data-go="home" aria-label="Tilbake">${icBack}</button><h2>Gjør opp</h2><span style="width:44px"></span></div>
      ${undo}
      ${t.length ? `<p class="muted" style="margin:0;line-height:1.5">Dette er det minste antallet betalinger som gjør alle skuls.</p>` : ''}
      ${rows || (undo ? '' : `<div class="center"><h2>Alle er skuls</h2></div>`)}
      <div class="muted small" id="copyMsg" aria-live="polite"></div>
      ${t.length ? `<div class="notice"><b>Slik fungerer det:</b> når du trykker «Betal med Vipps», blir beløpet gjort opp i appen med en gang, beløpet kopieres og Vipps åpnes. Send pengene til personen der (nummeret står over hvis de har lagt det inn). Trykket du ved en feil, kan du angre.</div>` : ''}`;
  }

  function vEntry() {
    const g = G(); const e = g?.entries.find(x => x.id === view.id);
    if (!e) { view = { name: 'home' }; return vHome(); }
    if (e.type === 'settle') return `
        <div class="row"><button class="icon-btn" data-go="home" aria-label="Tilbake">${icBack}</button><h2>Oppgjør</h2><span style="width:44px"></span></div>
        <div class="card"><div class="muted">${fmtDate(e.date)}</div><div style="font-weight:700;font-size:18px">${esc(mName(g, e.from))} betalte ${esc(mName(g, e.to))} ${kr(e.amount)}</div></div>
        <button class="btn-danger" data-act="delete" data-id="${e.id}">Slett oppføringen</button>`;
    const label = it => isAll(g, it.who) ? 'Felles' : it.who.map(id => mName(g, id)).join(', ');
    const color = it => isAll(g, it.who) ? 'var(--green)' : (it.who.length === 1 ? textColor(mColor(g, it.who[0])) : 'var(--muted)');
    const rows = e.items.map(it => `<div class="row"><span style="min-width:0">${esc(it.name)} <span class="catchip" style="background:${catOf(itemCat(it)).bg};color:${catOf(itemCat(it)).color};height:20px;font-size:11px;padding:0 6px">${catOf(itemCat(it)).label}</span></span><span class="row" style="gap:10px;flex-shrink:0"><span class="small" style="font-weight:700;color:${color(it)}">${esc(label(it))}</span><span style="font-weight:600">${kr(it.price)}</span></span></div>`).join('');
    const total = e.items.reduce((s, it) => s + (Number(it.price) || 0), 0);
    return `
      <div class="row"><button class="icon-btn" data-go="home" aria-label="Tilbake">${icBack}</button><h2>${esc(e.store || 'Kvittering')}</h2><span style="width:44px"></span></div>
      <div class="card"><div class="muted">${fmtDate(e.date)} · ${esc(mName(g, e.payer))} betalte${e.kind === 'recurring' ? ' · Fast utgift' : e.kind === 'expense' ? ' · Uten kvittering' : ''}</div>${rows}<div class="row" style="border-top:1px solid var(--line);padding-top:10px;font-weight:700"><span>Totalt</span><span>${kr(total)}</span></div></div>
      <button class="btn-ghost" data-act="edit" data-id="${e.id}">${e.kind ? 'Endre beløp eller fordeling' : 'Endre fordeling'}</button>
      <button class="btn-danger" data-act="delete" data-id="${e.id}">Slett kvitteringen</button>`;
  }

  // ---------- shared pickers ----------
  // payer chips: one person
  const payerChips = (g, sel, attr) => g.members.map(m => { const on = sel === m.id; return `<button type="button" class="chip" ${attr}="${m.id}" aria-pressed="${on}" style="${on ? 'background:var(--solid);border-color:var(--solid);color:#fff' : ''}">${esc(mName(g, m.id))}</button>`; }).join('');
  // share chips: "Felles" (everyone) or a set of people
  function shareChips(g, who, attr) {
    const all = isAll(g, who);
    return `<button type="button" class="chip" ${attr}="__all" aria-pressed="${all}" style="${all ? 'background:var(--green);border-color:var(--green);color:#fff' : ''}">Felles</button>` +
      g.members.map(m => { const on = !all && who.includes(m.id); return `<button type="button" class="chip" ${attr}="${m.id}" aria-pressed="${on}" style="${on ? `background:${m.color};border-color:${m.color};color:#fff` : ''}">${esc(mName(g, m.id))}</button>`; }).join('');
  }
  // tapping a person: from "Felles" -> only that person; otherwise toggle them in/out
  function toggleWho(g, who, id) {
    if (id === '__all') return allIds(g);
    if (isAll(g, who)) return [id];
    const next = who.includes(id) ? who.filter(x => x !== id) : [...who, id];
    return next.length ? next : allIds(g);
  }
  const whoLabel = (g, who) => !who || !who.length || isAll(g, who) ? 'Felles' : who.map(id => mName(g, id)).join(' og ');
  const parseKr = v => { const n = parseFloat(String(v || '').replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? r2(n) : NaN; };

  // add this month's entry for every recurring expense whose day has come, once per month

    let changed = false;

      for (let guard = 0; guard < 36; guard++) {

  async function shrink(file) {

      const s = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas');
      c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      return await new Promise(r => c.toBlob(b => r(b || file), 'image/jpeg', 0.85));
    } catch { return file; }
  }

    go({ name: 'scanning' });

    try {
      const img = await shrink(file);
      const prompt = `Du leser et bilde av en norsk butikkvittering (dagligvare, restaurant eller annen butikk).
Returner KUN JSON med denne formen:
{"store": "butikknavn eller tom streng", "date": "YYYY-MM-DD eller tom streng", "total": tall eller null, "items": [{"name": "varenavn, kort og lesbart med vanlig store/små bokstaver", "price": tall, "category": "mat" | "drikke" | "hygiene" | "husholdning" | "snus" | "pant" | "annet"}]}

Regler:
- Ta med hver varelinje med sluttpris for linjen (antall ganger enhetspris hvis det står flere).
- Pant er en egen vare med navnet "Pant", og skal stå rett etter drikken den hører til. Behold rekkefølgen fra kvitteringen.
- Rabatter og tilbud: trekk dem fra prisen på varen de gjelder hvis det er tydelig, ellers egen linje med negativ pris.
- Ikke ta med totalsum, mva, betalingsmåte, kortnummer, bonus eller veksel som varer.
- Bruk punktum som desimaltegn i tall.
- Hvis bildet ikke er en kvittering, returner {"store":"","date":"","total":null,"items":[]}.`;
      const res = await sample.json(prompt, { images: [img], signal: scanAbort.signal, modelTier: 'default' });
      const items = Array.isArray(res?.items) ? res.items.filter(x => x && x.name && isFinite(Number(x.price))) : [];
      if (!items.length) { go({ name: 'home' }); flash('Fant ingen varer på bildet. Prøv et skarpere bilde, eller legg inn selv.'); return; }
