      const now = new Date();
      const rec = { id: rdraft.id, name, amount: amt, payer: rdraft.payer, who: [...rdraft.who], day, split: null };
      if (rdraft.mode === 'custom') {
        const split = {}; let sum = 0;
        for (const m of g.members) {
          const raw = String(rdraft.split[m.id] || '').trim(); const v = raw ? parseKr(raw) : 0;
          if (!isFinite(v) || v < 0) { err.textContent = `Beløpet for ${mName(g, m.id)} ser ikke riktig ut.`; err.style.display = ''; return; }
          if (v > 0) { split[m.id] = v; sum += v; }
        }
        if (Math.abs(r2(sum) - amt) >= 0.01) { err.textContent = `Beløpene må til sammen bli ${kr(amt)}. Nå er de ${kr(sum)}.`; err.style.display = ''; return; }
        rec.split = split; rec.who = Object.keys(split);
      }
      const ex = g.recurring.find(x => x.id === rec.id);
      if (ex) Object.assign(ex, rec);
      // a new one starts this month if its day has come, otherwise next month's day
      else g.recurring.push({ ...rec, start: ym(now), made: [] });
      ensureRecurring(g); rdraft = null; save(); go({ name: 'recurring' });
    }
    else if (a === 'splitEvenly') { readRecurring(); fillEven(g); keepScroll(render); }
    else if (a === 'deleteRecurring') {
      if (el.dataset.confirm !== '1') { el.dataset.confirm = '1'; el.textContent = 'Trykk igjen for å stoppe'; return; }
      g.recurring = (g.recurring || []).filter(x => x.id !== rdraft.id); rdraft = null; save(); go({ name: 'recurring' });
    }
    else if (a === 'nextFact') { const n = funFacts().length; factIdx = n ? (factIdx + 1) % n : 0; keepScroll(render); }
    else if (a === 'copyMyData') {
      const t = document.getElementById('mydata'), msg = document.getElementById('dmsg');
      try { await navigator.clipboard.writeText(t.value); msg.textContent = 'Kopiert.'; } catch { t.focus(); t.select(); msg.textContent = 'Merk teksten og kopier den.'; }
    }
    else if (a === 'deleteAccount') {
      const v = (document.getElementById('delconfirm').value || '').trim().toUpperCase(); const err = document.getElementById('delerr');
      if (v !== 'SLETT') { err.textContent = 'Skriv SLETT i feltet for å bekrefte.'; err.style.display = ''; return; }
      deleteMyAccount(); go({ name: 'deleted' });
    }
    else if (a === 'startOver') go(startView());
    else if (a === 'copyInvite') {
      const link = document.getElementById('ilink').value, msg = document.getElementById('imsg');
      try { await navigator.clipboard.writeText(link); msg.textContent = 'Lenken er kopiert. Lim den inn i en melding.'; }
      catch { const i = document.getElementById('ilink'); i.focus(); i.select(); msg.textContent = 'Merk lenken og kopier den.'; }
    }
    else if (a === 'newInvite') {
      if (el.dataset.confirm !== '1') { el.dataset.confirm = '1'; el.textContent = 'Trykk igjen for å lage ny lenke'; return; }
      g.inviteCode = newCode(); save(); keepScroll(render);
    }
    else if (a === 'joinGroup') {
      const jg = data.groups.find(x => x.id === joinState?.gid);
      if (!jg || myId(jg) || jg.members.length >= MAX_MEMBERS) { go(startView()); return; }
      jg.members.push({ id: uid(), uid: meUid, name: personName(meUid) || 'Ny', color: nextColor(jg.members) });
      jg.entries.push({ id: uid(), by: meUid, at: new Date().toISOString(), type: 'join' });
      joinState = null; data.activeId = jg.id; save(); go({ name: 'home' });
    }
    else if (a === 'signOut') { if (window.DeltBackend) window.DeltBackend.signOut(); }
    else if (a === 'joinDone') { joinState = null; go(startView()); }
    else if (a === 'removePhoto') { readProfile(); pdraft.photo = ''; keepScroll(render); }
    else if (a === 'closeProfile') { pdraft = null; go({ name: 'start' }); }
    else if (a === 'removeMyBudget') { setMyBudget(g, 0); save(); keepScroll(render); }
    else if (a === 'removeBudget') { delete g.foodBudget; g.foodBudget = 0; save(); go({ name: 'home' }); }
    else if (a === 'clearChores') { g.chores = (g.chores || []).filter(x => !x.done); save(); keepScroll(render); }
    else if (a === 'clearDone') { g.list = (g.list || []).filter(x => !x.done); save(); keepScroll(render); }
    else if (a === 'scan') { $file.value = ''; $file.click(); }
    else if (a === 'manual') newDraft([{ name: 'Vare', price: 0 }], '', today());
    else if (a === 'demo') newDraft(DEMO, 'Rema 1000 (eksempel)', today(), 284.8);
    else if (a === 'cancelScan') { scanAbort?.abort(); go({ name: 'home' }); }
    else if (a === 'cancelDraft') { draft = null; go({ name: 'home' }); }
    else if (a === 'addItem') { draft.items.push({ name: '', price: 0, who: allIds(g), share: false }); keepScroll(render); const l = $app.querySelectorAll('[data-name]'); l[l.length - 1]?.focus(); }
    else if (a === 'allShared') { draft.items.forEach(it => { it.who = allIds(g); it.share = false; it.learned = false; }); keepScroll(render); }
    else if (a === 'saveDraft') {
      $app.querySelectorAll('[data-name]').forEach(inp => draft.items[+inp.dataset.name].name = inp.value);
      const st = document.getElementById('store'); if (st) draft.store = st.value;
      draft.items.forEach(it => { if (it.catTouched && key(it.name)) { g.learnedCat = g.learnedCat || {}; g.learnedCat[key(it.name)] = it.cat; } });
      const items = draft.items.filter(it => it.name.trim() || it.price).map(({ name, price, who, cat }) => ({ name: name.trim() || 'Vare', price, cat: cat || guessCat(name), who: who.length ? [...who] : allIds(g) }));
      for (const it of items) { const k = key(it.name); if (k && k !== 'pant' && k !== 'vare') { if (isAll(g, it.who)) delete g.learned[k]; else g.learned[k] = [...it.who]; } }
      const prev = g.entries.find(e => e.id === draft.id);
      const entry = { id: draft.id, type: 'receipt', store: draft.store, date: draft.date, payer: draft.payer, weights: { ...(g.weights || {}) }, items };
      if (prev && prev.kind) { entry.kind = prev.kind; if (prev.recurringId) entry.recurringId = prev.recurringId; }
      if (draft.listMatched && draft.listMatched.length && g.list) g.list.forEach(li => { if (draft.listMatched.includes(li.id)) li.done = true; });
      const idx = g.entries.findIndex(e => e.id === entry.id);
      entry.by = meUid || ''; entry.at = new Date().toISOString(); if (prev) entry.edited = true;
      if (idx >= 0) g.entries[idx] = entry; else g.entries.push(entry);
      draft = null; save(); go({ name: 'home' });
    }
    else if (a === 'edit') {
      const e = g.entries.find(x => x.id === el.dataset.id);
      if (e) { draft = { id: e.id, store: e.store, date: e.date, payer: e.payer, receiptTotal: null, items: e.items.map(it => { const who = [...(it.who || allIds(g))]; return { ...it, cat: it.cat || catFor(g, it.name), who, share: who.length > 1 && !isAll(g, who), learned: false }; }) }; linkPant(draft.items, false); go({ name: 'assign' }); }
    }
    else if (a === 'delete') {
      if (el.dataset.confirm !== '1') { el.dataset.confirm = '1'; el.textContent = 'Trykk igjen for å slette'; return; }
      g.entries = g.entries.filter(x => x.id !== el.dataset.id); save(); go({ name: 'home' });
    }
  }

  $file.onchange = () => { const f = $file.files && $file.files[0]; if (f) scan(f); };
  init();
})();
</script>
</body>
</html>
